    <text x="48" y="302" font-size="14.5" fill="#8a7d78"><tspan fill="#f0b982">loc</tspan>  Burgos, ES<tspan fill="#f0b982" dx="22">git</tspan>  github.com/irg1008<tspan fill="#f0b982" dx="22">foto</tspan>  the.fotoapp.co/gazquez</text>

